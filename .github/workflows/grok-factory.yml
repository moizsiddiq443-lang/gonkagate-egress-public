# Grok (xAI) account factory — PUBLIC repo egress lane (free unlimited runner minutes)
# Confidentiality by design (same doctrine as gonkagate-egress):
#   - factory runs with --registry pointing at a .tmp file (gitignored)
#   - grok-enc.mjs envelope-encrypts results (AES-256-GCM + RSA-4096) before commit
#   - plaintext temp files are deleted by grok-enc.mjs
#   - NO password input: the runner generates a random password in-run and encrypts it
#     into the result artifact — nothing sensitive ever lands in dispatch inputs/logs
# The public repo only ever contains scripts + ciphertext. Only the local holder
# of egress-private.pem can decrypt (scripts/grok-decrypt.mjs locally).

name: grok-factory

on:
  workflow_dispatch:
    inputs:
      email:
        description: "temp email (optional — runner mints a fresh dotGmail from its own IP when omitted)"
        required: false
        type: string
      extra_args:
        description: "extra factory args (e.g. --signup-first)"
        required: false
        type: string
      count:
        description: "attempts per run (batch; keep <=8 per runner IP)"
        required: false
        default: "1"
        type: string
      hedge:
        description: "parallel attempts per run (hedge factor; 1-4)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install playwright chromium (stealth browser for accounts.x.ai)
        run: |
          npm i playwright-core@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Run grok factory BATCH (fresh datacenter IP, reset-rail + device-flow mint)
        run: |
          COUNT="${{ github.event.inputs.count }}"; COUNT="${COUNT:-1}"
          HEDGE="${{ github.event.inputs.hedge }}"; HEDGE="${HEDGE:-1}"
          node scripts/grok-factory-batch.mjs --count "$COUNT" --hedge "$HEDGE" \
            --email "${{ github.event.inputs.email }}" \
            --factory-args "${{ github.event.inputs.extra_args }}"

      - name: Commit encrypted runner results
        run: |
          git config user.name "grok-factory-worker"
          git config user.email "worker@localhost"
          git add -A
          git commit -m "grok-factory: results $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase 2>/dev/null || true
            if git push; then echo "push ok (attempt $i)"; break; fi
            echo "push failed (attempt $i) — retrying"
            sleep 5
          done